services:
  etcd:
    image: ${ETCD_IMAGE:-gcr.io/etcd-development/etcd:v3.6.14}
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=${CLUSTER_NODE_ID:?render cluster node config}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${CLUSTER_WG_IP:?render cluster node config}:${CLUSTER_ETCD_CLIENT_PORT:-2379}
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${CLUSTER_WG_IP:?render cluster node config}:${CLUSTER_ETCD_PEER_PORT:-2380}
      - --initial-cluster=${CLUSTER_ETCD_INITIAL_CLUSTER:?render cluster node config}
      - --initial-cluster-state=new
      - --initial-cluster-token=${CLUSTER_ETCD_TOKEN:?render cluster node config}
      - --auto-compaction-retention=1h
      - --snapshot-count=10000
      - --quota-backend-bytes=2147483648
    ports:
      - ${CLUSTER_ETCD_BIND:?render cluster node config}:${CLUSTER_ETCD_CLIENT_PORT:-2379}:2379
      - ${CLUSTER_ETCD_BIND:?render cluster node config}:${CLUSTER_ETCD_PEER_PORT:-2380}:2380
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
  postgres:
    image: ${POSTGRES_HA_IMAGE:-ghcr.io/pivasya/taskforge/postgres-ha:develop}
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/run/taskforge-patroni-wrapper.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TASKFORGE_PATRONI_VALIDATE_ONLY: ${TASKFORGE_PATRONI_VALIDATE_ONLY:-0}
    ports:
      - ${CLUSTER_POSTGRES_BIND:?render node first}:5432:5432
      - ${CLUSTER_PATRONI_REST_BIND:?render node first}:8008:8008
    volumes:
      - postgres-cluster-data:/var/lib/postgresql
      - ${TASKFORGE_STATE_ROOT:?set TASKFORGE_STATE_ROOT}/cluster:/run/taskforge-cluster:ro
      - ${TASKFORGE_CONTROL_ROOT:?set TASKFORGE_CONTROL_ROOT}/cluster/ops/quorum/patroni-container-entrypoint.sh:/run/taskforge-patroni-wrapper.sh:ro
      - ${TASKFORGE_POSTGRES_INIT_DIR:?set TASKFORGE_POSTGRES_INIT_DIR}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
  gateway:
    restart: "on-failure:5"
    environment:
      TASKFORGE_HA_DYNAMIC_READY: "true"
      HA_NODE_ID: ${CLUSTER_NODE_ID:?render cluster node config}
    volumes:
      - ${TASKFORGE_STATE_ROOT:?set TASKFORGE_STATE_ROOT}/cluster/readiness:/run/taskforge-cluster:ro
  content-api:
    restart: "on-failure:5"
    volumes:
      - ${TASKFORGE_CONTENT_DP_DIR:?set TASKFORGE_CONTENT_DP_DIR}:/root/.aspnet/DataProtection-Keys
  quiz-api:
    restart: "on-failure:5"
    volumes:
      - ${TASKFORGE_QUIZ_DP_DIR:?set TASKFORGE_QUIZ_DP_DIR}:/root/.aspnet/DataProtection-Keys
  browser-api:
    restart: "on-failure:5"
    ports:
      - ${CLUSTER_WG_IP:?render cluster node config}:${TASKFORGE_BROWSER_CLUSTER_PORT:-18080}:8080
  image-analyzer:
    restart: "on-failure:5"
    ports:
      - ${CLUSTER_WG_IP:?render cluster node config}:${TASKFORGE_IMAGE_ANALYZER_CLUSTER_PORT:-18090}:8080
volumes:
  etcd-data:
  postgres-cluster-data:
