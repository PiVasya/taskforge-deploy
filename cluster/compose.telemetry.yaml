services:
  observability-api:
    environment:
      ClusterTelemetry__AgentUrls: ${TASKFORGE_CLUSTER_AGENT_URLS:-}
      ClusterTelemetry__LocalTelemetryPath: /run/taskforge-cluster-host/node-telemetry.json
      ClusterTelemetry__PollSeconds: ${TASKFORGE_CLUSTER_TELEMETRY_POLL_SECONDS:-5}
      ClusterTelemetry__TelemetryPollSeconds: ${TASKFORGE_CLUSTER_TELEMETRY_FETCH_SECONDS:-10}
      ClusterTelemetry__DownAfterSeconds: ${TASKFORGE_CLUSTER_NODE_DOWN_AFTER_SECONDS:-60}
      ClusterTelemetry__LiveTimeoutSeconds: ${TASKFORGE_CLUSTER_LIVE_TIMEOUT_SECONDS:-2}
      ClusterTelemetry__TelemetryTimeoutSeconds: ${TASKFORGE_CLUSTER_TELEMETRY_TIMEOUT_SECONDS:-8}
      ClusterTelemetry__SupportBotUrl: http://support-bot:8080
      ClusterTelemetry__InternalKey: ${TASKFORGE_INTERNAL_KEY:?set TASKFORGE_INTERNAL_KEY}
      ClusterTelemetry__NotificationsEnabled: ${CLUSTER_TELEMETRY_NOTIFICATIONS_ENABLED:-true}
    volumes:
      - ${TASKFORGE_STATE_ROOT:?set TASKFORGE_STATE_ROOT}/cluster:/run/taskforge-cluster-host:ro
